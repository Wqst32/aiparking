<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>System Parkingu AI</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .miejsce { padding: 20px; border-radius: 10px; text-align: center; }
        .wolne { background: #d4edda; border: 2px solid #28a745; }
        .zajete { background: #f8d7da; border: 2px solid #dc3545; }
        .stats { display: flex; justify-content: center; gap: 40px; font-size: 1.2em; }
        .ostatnie { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Parking z AI - system 3-etapowy</h1>
        
        <div class="grid" id="parking"></div>
        
        <div class="stats">
            <div>Wolne: <span id="wolne">0</span></div>
            <div>Zajęte: <span id="zajete">0</span></div>
        </div>
        
        <div class="ostatnie" id="archiwum">
            <h3>📸 Ostatnie rozpoznane:</h3>
            <div id="lista-zdjec">Brak</div>
        </div>
    </div>

    <script>
        async function ladujDane() {
            try {
                const response = await fetch('data/parking.json?_=' + Date.now());
                const dane = await response.json();
                
                let html = '';
                let wolne = 0;
                
                dane.forEach(m => {
                    if (m.status === 'wolne') wolne++;
                    html += `
                        <div class="miejsce ${m.status}">
                            <h3>Miejsce ${m.id}</h3>
                            <p>${m.blacha}</p>
                            <p>${m.status.toUpperCase()}</p>
                            <small>${m.czas}</small>
                        </div>
                    `;
                });
                
                document.getElementById('parking').innerHTML = html;
                document.getElementById('wolne').textContent = wolne;
                document.getElementById('zajete').textContent = 6 - wolne;
                
                // Sprawdź archiwum (opcjonalnie)
                const archiwum = await fetch('zdjecia_gotowe/?list');
                // To wymaga dodatkowej konfiguracji
                
            } catch (e) {
                console.error('Błąd:', e);
            }
        }
        
        ladujDane();
        setInterval(ladujDane, 5000);
    </script>
</body>
</html>

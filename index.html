<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Parkingu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .parking-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .parking-spot {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .parking-spot.wolne {
            background: #d4edda;
            border-color: #28a745;
        }

        .parking-spot.zajete {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .spot-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .spot-plate {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }

        .spot-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .wolne .spot-status {
            background: #28a745;
            color: white;
        }

        .zajete .spot-status {
            background: #dc3545;
            color: white;
        }

        .spot-time {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            display: block;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .last-update {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .parking-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Monitor Parkingu</h1>
        <p class="subtitle">6 miejsc parkingowych - odświeżanie co 5 sekund</p>
        
        <div class="parking-grid" id="parkingGrid">
            <!-- Miejsca parkingowe będą generowane przez JavaScript -->
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Wolne miejsca:</span>
                <span class="stat-value" id="freeSpots">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Zajęte miejsca:</span>
                <span class="stat-value" id="occupiedSpots">0</span>
            </div>
        </div>
        
        <div class="last-update">
            Ostatnia aktualizacja: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <script>
        // Funkcja do pobierania danych z bazy
        async function fetchParkingData() {
            try {
                const response = await fetch('api/get_parking.php');
                const data = await response.json();
                updateParkingDisplay(data);
                updateLastUpdateTime();
            } catch (error) {
                console.error('Błąd pobierania danych:', error);
            }
        }

        // Funkcja do aktualizacji wyświetlania
        function updateParkingDisplay(spots) {
            const grid = document.getElementById('parkingGrid');
            let freeCount = 0;
            let occupiedCount = 0;

            grid.innerHTML = spots.map(spot => {
                if (spot.status === 'wolne') {
                    freeCount++;
                } else {
                    occupiedCount++;
                }

                return `
                    <div class="parking-spot ${spot.status}">
                        <div class="spot-number">Miejsce ${spot.id}</div>
                        <div class="spot-plate">${spot.blacha}</div>
                        <div class="spot-status">${spot.status}</div>
                        <div class="spot-time">${spot.czas || '---'}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('freeSpots').textContent = freeCount;
            document.getElementById('occupiedSpots').textContent = occupiedCount;
        }

        // Funkcja do aktualizacji czasu
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('pl-PL');
            document.getElementById('lastUpdate').textContent = timeString;
        }

        // Odświeżanie danych co 5 sekund
        setInterval(fetchParkingData, 5000);

        // Pierwsze pobranie danych po załadowaniu strony
        fetchParkingData();
    </script>
</body>
</html>

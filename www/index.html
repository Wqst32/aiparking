<!DOCTYPE html>
<html>
<head>

<style>

.grid{
display:grid;
grid-template-columns:repeat(3,150px);
gap:20px;
}

.miejsce{
height:100px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:20px;
}

.wolne{
background:green;
}

.zajete{
background:red;
}

</style>

</head>

<body>

<h1>Parking</h1>

<div class="grid" id="parking"></div>

<script>

function load(){

fetch("get.php")
.then(r=>r.json())
.then(data=>{

let html="";

data.forEach(m=>{

html+=`
<div class="miejsce ${m.status}">
${m.id}<br>
${m.blacha}
</div>
`;

});

document.getElementById("parking").innerHTML=html;

});

}

load();
setInterval(load,1000);

</script>

</body>
</html>

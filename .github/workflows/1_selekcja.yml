name: Selekcja

on:
  push:
    paths:
      - 'zdjecia/**'
      - 'zdjecia_czekajace/**'
      - 'data/**'
      - 'model.h5'
      - 'ai_z_modelem.py'
      - 'selekcja.py'
    # Wyklucz zmiany w folderze _site (gdzie buduje się strona)
    paths-ignore:
      - '_site/**'
      - '.github/workflows/jekyll-*.yml'

jobs:
  selekcja:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalacja
        run: pip install opencv-python-headless numpy
      
      - name: Uruchom selekcję
        run: python selekcja.py
      
      - name: Push zmian
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia/ zdjecia_czekajace/
          git pull --rebase origin main || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Selekcja"
          git push origin main

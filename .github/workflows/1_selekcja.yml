name: Selekcja

on:
  push:
    paths:
      - 'zdjecia/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selekcja:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Konfiguracja Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      
      - name: Instalacja
        run: pip install opencv-python-headless numpy
      
      - name: Uruchom selekcję
        run: python selekcja.py
      
      - name: DEBUG - sprawdz czy plik jest w zdjecia_czekajace
        run: |
          echo "📂 Zawartość zdjecia_czekajace:"
          ls -la zdjecia_czekajace/ || echo "❌ Folder nie istnieje"
          
          if [ "$(ls -A zdjecia_czekajace/ 2>/dev/null)" ]; then
            echo "✅ TRIGGER ZADZIAŁA - plik jest w zdjecia_czekajace!"
          else
            echo "❌ BRAK PLIKU - trigger nie zadziała"
          fi

      - name: Push zmian
        run: |
          git add zdjecia/ zdjecia_czekajace/
          git pull --rebase origin main || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Selekcja"
          git push origin main

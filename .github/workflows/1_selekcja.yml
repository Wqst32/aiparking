name: Pełny proces - selekcja i AI

on:
  push:
    paths:
      - 'zdjecia/*.jpg'
      - 'zdjecia/*.jpeg'
      - 'zdjecia/*.png'

jobs:
  proces:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v3
      
      - name: Instalacja bibliotek
        run: |
          pip install opencv-python-headless numpy
      
      - name: Krok 1 - Selekcja zdjęć
        run: python selekcja.py
      
      - name: Krok 2 - AI rozpoznawanie
        run: python ai_symulacja.py
      
      - name: Zapisz wszystkie zmiany
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia/ zdjecia_czekajace/ zdjecia_gotowe/ data/parking.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto proces: selekcja + AI"
          git push

name: System Parkingu

on:
  push:
    paths:
      - 'zdjecia/**'
      - 'zdjecia_czekajace/**'

jobs:
  proces:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Instalacja OpenCV
        run: pip install opencv-python-headless numpy
      
      - name: Uruchom selekcję (jeśli są zdjęcia)
        run: python selekcja.py || true
      
      - name: Uruchom AI (jeśli są zdjęcia w czekajace)
        run: python ai_symulacja.py || true
      
      - name: Zapisz zmiany
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update"
          git push

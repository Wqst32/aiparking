name: Parking

on:
  push:
    paths:
      - 'zdjecia/**'
      - 'zdjecia_czekajace/**'

jobs:
  selekcja:
    if: contains(github.event.head_commit.modified, 'zdjecia/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install opencv-python-headless numpy
      - run: python selekcja.py
      - run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia/ zdjecia_czekajace/
          git diff --quiet && git diff --staged --quiet || git commit -m "Selekcja"
          git push

  ai:
    if: contains(github.event.head_commit.modified, 'zdjecia_czekajace/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: selekcja
    steps:
      - uses: actions/checkout@v4
      - run: pip install tensorflow opencv-python-headless numpy
      - run: python ai_z_modelem.py
      - run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia_czekajace/ zdjecia_gotowe/ data/parking.json
          git diff --quiet && git diff --staged --quiet || git commit -m "AI"
          git push

name: Parking

on:
  push:
    paths:
      - 'zdjecia/**'
      - 'zdjecia_czekajace/**'

jobs:
  selekcja:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Konfiguracja Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Pull najnowsze zmiany
        run: git pull --rebase origin main
      
      - name: Sprawdź czy są zdjęcia w zdjecia/
        run: |
          if [ -n "$(ls -A zdjecia/ 2>/dev/null)" ]; then
            echo "📸 Są zdjęcia - uruchamiam selekcję"
            pip install opencv-python-headless numpy
            python selekcja.py
          fi
      
      - name: Commit i push
        run: |
          git add zdjecia/ zdjecia_czekajace/
          git diff --quiet && git diff --staged --quiet || git commit -m "Selekcja"
          git pull --rebase origin main
          git push origin main

  ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: selekcja
    steps:
      - uses: actions/checkout@v4
      
      - name: Konfiguracja Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Pull najnowsze zmiany
        run: git pull --rebase origin main
      
      - name: Sprawdź czy są zdjęcia w zdjecia_czekajace/
        run: |
          if [ -n "$(ls -A zdjecia_czekajace/ 2>/dev/null)" ]; then
            echo "🤖 Są zdjęcia - uruchamiam AI"
            pip install tensorflow opencv-python-headless numpy
            python ai_z_modelem.py
          fi
      
      - name: Commit i push
        run: |
          git add zdjecia_czekajace/ zdjecia_gotowe/ data/parking.json
          git diff --quiet && git diff --staged --quiet || git commit -m "AI"
          git pull --rebase origin main
          git push origin main

name: AI

on:
  push:
    paths:
      - 'zdjecia_czekajace/**'

jobs:
  ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalacja
        run: pip install tensorflow opencv-python-headless numpy
      
      - name: Uruchom AI
        run: python ai_z_modelem.py
      
      - name: Push zmian
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia_czekajace/ zdjecia_gotowe/ data/parking.json
          git pull --rebase origin main || true
          git diff --quiet && git diff --staged --quiet || git commit -m "AI"
          git push origin main

name: 2. AI - rozpoznawanie tablic

on:
  push:
    paths:
      - 'zdjecia_czekajace/*.jpg'
      - 'zdjecia_czekajace/*.jpeg'
      - 'zdjecia_czekajace/*.png'

jobs:
  ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v3
      
      - name: Instalacja bibliotek
        run: pip install numpy
      
      - name: Uruchom AI (symulacja)
        run: python ai_symulacja.py
      
      - name: Zapisz zmiany
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add zdjecia_czekajace/ zdjecia_gotowe/ data/parking.json
          git diff --quiet && git diff --staged --quiet || git commit -m "AI: rozpoznano tablicę"
          git push
